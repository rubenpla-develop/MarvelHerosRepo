build:
  maxIssues: 0
  weights:
    complexity: 2
    LongParameterList: 1
    style: 1

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([A-Z][a-zA-Z0-9]*)|([a-z][a-zA-Z0-9]*)$'
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2, 255]
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    excludePaths: '.*Colors.kt'

  FunctionMaxLength:
    active: true
    maximumFunctionLength: 60

  ReturnCount:
    active: true
    max: 4

  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']

  ForbiddenComment:
    active: false  # deprecated, usa `comments` si quieres control de TODO/FIXME

complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 20

  NestedBlockDepth:
    active: true
    threshold: 4

  ComplexMethod:
    active: true
    threshold: 15

comments:
  CommentOverPrivateFunction:
    active: false

  UndocumentedPublicClass:
    active: false
