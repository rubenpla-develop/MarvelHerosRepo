build:
  maxIssues: 0

naming:
  FunctionNaming:
    active: true
    functionPattern: '^([A-Z][a-zA-Z0-9]*)|([a-z][a-zA-Z0-9]*)$'
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    active: true
    ignoreNumbers: [-1, 0, 1, 2, 255]
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: true
    ignoreAnnotation: true
    excludes: ['**/Colors.kt']

  ReturnCount:
    active: true
    max: 4

  WildcardImport:
    active: true
    excludeImports: ['java.util.*', 'kotlinx.coroutines.*']

complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 20

  NestedBlockDepth:
    active: true
    threshold: 4

  CyclomaticComplexMethod:
    active: true
    threshold: 15

FunctionLength:
  active: true
  maximum: 60

comments:
  CommentOverPrivateFunction:
    active: false

  UndocumentedPublicClass:
    active: false
